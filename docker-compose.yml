version: "3.9"

services:
  api:
    build: .
    container_name: thermowatch-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build: .
    container_name: thermowatch-dashboard
    command: streamlit run api/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
